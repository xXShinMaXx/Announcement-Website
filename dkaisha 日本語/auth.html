<div class="auth__container">

    <div class="auth__box">

      <div class="auth__logo">
        D 会社
      </div>

      <!-- タブ -->
      <div id="message"></div>
      <div class="tab__buttons">

        <button
          type="button"
          class="tab__btn active"
          onclick="showLogin()"
        >
          ログイン
        </button>

        <button
          type="button"
          class="tab__btn"
          onclick="showSignup()"
        >
          サインアップ
        </button>

      </div>

      <!-- ログインフォーム -->
      <div id="login__form">

        <h1>
          お帰りなさい
        </h1>

        <p class="subtitle">
          会社のお知らせにアクセスするにはログインしてください
        </p>

        <form action="login.php" method="POST">

          <div class="input__group">

            <label>メールアドレス</label>

            <input
              type="email"
              name="email"
              placeholder="メールアドレス"
              required
            >

          </div>

          <div class="input__group">

            <label>パスワード</label>

            <input
              type="password"
              name="password"
              placeholder="パスワード"
              required
            >

          </div>

          <button type="submit" class="auth__btn">
            ログイン
          </button>

        </form>

      </div>

      <!-- サインアップフォーム -->
      <div id="signup__form" style="display: none;">

        <h1>
          アカウントを作成
        </h1>

        <p class="subtitle">
          会社のお知らせにアクセスするにはアカウントを作成してください
        </p>

        <form action="signup.php" method="POST">

          
          <div class="input__group">

            <label>氏名</label>

            <input
              type="text"
              name="fullname"
              placeholder="氏名"
              required
            >

          </div>

          <div class="input__group">

            <label>メールアドレス</label>

            <input
              type="email"
              name="email"
              placeholder="メールアドレス"
              required
            >

          </div>

          <div class="input__group">

            <label>パスワード</label>

            <input
              type="password"
              name="password"
              placeholder="パスワード"
              required
            >

          </div>

          <div class="input__group">

            <label>パスワードの確認</label>

            <input
              type="password"
              name="confirm_password"
              placeholder="パスワードの確認"
              required
            >

          </div>

          <button type="submit" class="auth__btn">
            サインアップ
          </button>

        </form>

      </div>

    </div>

  </div>


   <script src="app.js"></script>
</body>
</html>
